<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Feed — Realtime Notifier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d26;
      --surface2:  #21253200;
      --border:    #2a2d3a;
      --text:      #e2e4ed;
      --muted:     #6b7080;
      --accent:    #4f8ef7;
      --green:     #34c77b;
      --yellow:    #f5a623;
      --red:       #e05c5c;
      --insert-hl: rgba(52, 199, 123, 0.12);
      --update-hl: rgba(79, 142, 247, 0.12);
      --delete-hl: rgba(224, 92, 92, 0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .logo span { color: var(--accent); }

    #status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    #status-dot.connected    { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #status-dot.reconnecting { background: var(--yellow); animation: pulse 1s infinite; }
    #status-dot.disconnected { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .top-bar h1 { font-size: 20px; font-weight: 600; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; }

    input, select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover       { opacity: 0.85; }
    button:disabled    { opacity: 0.4; cursor: not-allowed; }

    button.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.danger {
      background: var(--red);
      color: #fff;
    }

    button.warn {
      background: #c97d15;
      color: #fff;
    }

    /* Stats row */
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      flex: 1;
      min-width: 130px;
    }

    .stat-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .stat-card .value { font-size: 22px; font-weight: 600; }
    .stat-card .value.green  { color: var(--green); }
    .stat-card .value.yellow { color: var(--yellow); }
    .stat-card .value.blue   { color: var(--accent); }
    .stat-card .value.red    { color: var(--red); }

    /* Active orders */
    .panel-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
      min-height: 60px;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      position: relative;
      transition: border-color 0.3s, opacity 0.3s;
    }

    .order-card.flash-insert { animation: card-insert 1.5s ease-out; }
    .order-card.flash-update { animation: card-update 1.5s ease-out; }
    .order-card.removing     { animation: card-remove 0.4s ease-out forwards; }

    @keyframes card-insert { 0% { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); } 100% { border-color: var(--border); } }
    @keyframes card-update { 0% { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); } 100% { border-color: var(--border); } }
    @keyframes card-remove { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }

    .card-id    { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
    .card-name  { font-weight: 600; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-product { font-size: 12px; color: var(--muted); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; }

    .status-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .pill-pending   { background: rgba(245,166,35,0.15);  color: var(--yellow); }
    .pill-shipped   { background: rgba(79,142,247,0.15);  color: var(--accent); }
    .pill-delivered { background: rgba(52,199,123,0.15);  color: var(--green); }

    .card-del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }

    .card-del-btn:hover { color: var(--red); background: rgba(224,92,92,0.12); opacity: 1; }

    .orders-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 8px 0;
    }

    /* Event log */
    #event-log {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .log-header {
      display: grid;
      grid-template-columns: 80px 70px 1fr 1fr 100px 60px;
      gap: 12px;
      padding: 8px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .log-rows { max-height: 230px; overflow-y: auto; }

    .log-row {
      display: grid;
      grid-template-columns: 80px 70px 1fr 1fr 100px 60px;
      gap: 12px;
      padding: 9px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      align-items: center;
    }

    .log-row:last-child { border-bottom: none; }

    .log-row.new-insert { animation: flash-insert 1.5s ease-out; }
    .log-row.new-update { animation: flash-update 1.5s ease-out; }
    .log-row.new-delete { animation: flash-delete 1.5s ease-out; }

    @keyframes flash-insert { 0% { background: var(--insert-hl); } 100% { background: transparent; } }
    @keyframes flash-update { 0% { background: var(--update-hl); } 100% { background: transparent; } }
    @keyframes flash-delete { 0% { background: var(--delete-hl); } 100% { background: transparent; } }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-INSERT  { background: rgba(52,199,123,0.15); color: var(--green); }
    .badge-UPDATE  { background: rgba(79,142,247,0.15); color: var(--accent); }
    .badge-DELETE  { background: rgba(224,92,92,0.15);  color: var(--red); }

    .status-pending   { color: var(--yellow); }
    .status-shipped   { color: var(--accent); }
    .status-delivered { color: var(--green); }
    .status-deleted   { color: var(--red); font-style: italic; }

    .ts { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    /* Form panels */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 0;
    }

    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

    .form-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }

    .form-panel h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    .form-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .form-row input, .form-row select { flex: 1; min-width: 130px; }
    .form-row button                   { flex-shrink: 0; }

    .divider-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 20px 0 10px;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 13px;
      max-width: 300px;
      animation: slide-in 0.25s ease-out, fade-out 0.3s ease-in 3.7s forwards;
    }

    .toast.toast-delete { border-left-color: var(--red); }
    .toast.toast-insert { border-left-color: var(--green); }

    @keyframes slide-in { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; pointer-events: none; } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">order<span>feed</span> · realtime</div>
  <div id="status-badge">
    <div id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<main>
  <div class="top-bar">
    <h1>Live Order Stream</h1>
    <div class="controls">
      <button class="secondary" id="btn-clear">Clear log</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="label">Total Events</div>
      <div class="value blue" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Inserts</div>
      <div class="value green" id="stat-insert">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Updates</div>
      <div class="value" style="color:var(--accent)" id="stat-update">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Deletes</div>
      <div class="value red" id="stat-delete">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Active Orders</div>
      <div class="value yellow" id="stat-active">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg Latency</div>
      <div class="value green" id="stat-latency">—</div>
    </div>
  </div>

  <!-- Live orders grid -->
<div class="panel-label">
  Active Orders
  <span id="orders-count" style="color:var(--muted);font-size:10px;margin-left:6px;"></span>
</div>

<div id="orders-grid">
  <span class="orders-empty" id="orders-empty">Loading orders…</span>
</div>

<div id="orders-toggle-wrapper" style="display:none; margin-bottom:24px;">
  <button class="secondary" id="toggle-orders-btn">
    Show More Orders
  </button>
</div>

  <!-- Event log -->
  <div class="panel-label">Event Log</div>
  <div id="event-log">
    <div class="log-header">
      <span>Time</span>
      <span>Event</span>
      <span>Customer</span>
      <span>Product</span>
      <span>Status</span>
      <span>ID</span>
    </div>
    <div class="log-rows" id="log-rows">
      <div class="empty-state" id="empty-msg">Waiting for events…</div>
    </div>
  </div>

  <!-- Action panels -->
  <div class="divider-label">Actions</div>
  <div class="form-grid">

    <div class="form-panel">
      <h3>➕ Create Order</h3>
      <div class="form-row">
        <input id="inp-customer" type="text" placeholder="Customer name" value="Rohan Mehta" />
        <input id="inp-product"  type="text" placeholder="Product name"  value="Mechanical Keyboard" />
        <select id="inp-status">
          <option value="pending">pending</option>
          <option value="shipped">shipped</option>
          <option value="delivered">delivered</option>
        </select>
        <button id="btn-create">Create</button>
      </div>
    </div>

    <div class="form-panel">
      <h3>🗑️ Delete Order</h3>
      <div class="form-row">
        <input id="inp-delete-id" type="number" placeholder="Order ID" min="1" />
        <button class="danger" id="btn-delete">Delete</button>
      </div>
      <div style="margin-top:10px;">
        <h3 style="margin-bottom:8px;">✏️ Update Status</h3>
        <div class="form-row">
          <input id="inp-update-id" type="number" placeholder="Order ID" min="1" />
          <select id="inp-update-status">
            <option value="pending">pending</option>
            <option value="shipped">shipped</option>
            <option value="delivered">delivered</option>
          </select>
          <button class="warn" id="btn-update">Update</button>
        </div>
      </div>
    </div>

  </div>
</main>

<div class="toast-container" id="toast-container"></div>

<script>
  const API_BASE = `${location.protocol}//${location.host}/api/orders`;
  const WS_URL   = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/orders`;

  // ── State ────────────────────────────────────────────────────────
  let ws;
  let reconnectDelay = 1000;
  let eventCount  = 0;
  let insertCount = 0;
  let updateCount = 0;
  let deleteCount = 0;
  let latencies   = [];

  // Live order tracking: Map<orderId (number), cardElement>
  const activeOrders = new Map();
  let showAllOrders = false;
  const MAX_VISIBLE_ORDERS = 4;

  // ── WebSocket with exponential-backoff reconnection ──────────────
  function connect() {
    setStatus('reconnecting', 'Connecting…');
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      reconnectDelay = 1000;
      setStatus('connected', 'Connected');
      toast('Connected to order feed', 'insert');
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'connected') return;
      handleEvent(msg);
    };

    ws.onerror = () => {};

    ws.onclose = () => {
      setStatus('disconnected', `Reconnecting in ${(reconnectDelay / 1000).toFixed(0)}s…`);
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 30000);
    };
  }

  // ── Load current orders on startup ──────────────────────────────
  async function loadInitialOrders() {
    try {
      const res = await fetch(API_BASE + '/');
      if (!res.ok) return;
      const orders = await res.json();
      const empty = document.getElementById('orders-empty');
      if (orders.length === 0) {
        if (empty) empty.textContent = 'No active orders — create one below.';
        return;
      }
      if (empty) empty.remove();
      // Render in reverse so newest is first (API returns DESC already)
      orders.forEach(order => renderOrderCard(order, null));
      updateActiveCount();
    } catch (_) {
      const empty = document.getElementById('orders-empty');
      if (empty) empty.textContent = 'Could not load orders.';
    }
  }

  // ── Render / update / remove order cards ────────────────────────
  function renderOrderCard(data, flashClass) {
    const grid = document.getElementById('orders-grid');
    const empty = document.getElementById('orders-empty');
    if (empty) empty.remove();

    if (activeOrders.has(data.id)) {
      // Update existing card
      const card = activeOrders.get(data.id);
      card.querySelector('.card-name').textContent    = data.customer_name;
      card.querySelector('.card-product').textContent = data.product_name;
      const pill = card.querySelector('.status-pill');
      pill.className = `status-pill pill-${data.status}`;
      pill.textContent = data.status;
      if (flashClass) {
        card.classList.remove('flash-insert', 'flash-update');
        void card.offsetWidth; // reflow to restart animation
        card.classList.add(flashClass);
      }
      refreshOrderVisibility();
    } else {
      // New card
      const card = document.createElement('div');
      card.className = `order-card${flashClass ? ' ' + flashClass : ''}`;
      card.dataset.orderId = data.id;
      card.innerHTML = `
        <div class="card-id">Order #${data.id}</div>
        <div class="card-name">${escHtml(data.customer_name)}</div>
        <div class="card-product">${escHtml(data.product_name)}</div>
        <div class="card-footer">
          <span class="status-pill pill-${data.status}">${data.status}</span>
          <button class="card-del-btn" title="Delete this order" data-id="${data.id}">✕</button>
        </div>
      `;
      card.querySelector('.card-del-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteOrder(data.id);
      });
      grid.prepend(card);
      activeOrders.set(data.id, card);
      refreshOrderVisibility();
    }

    updateActiveCount();
  }

  function refreshOrderVisibility() {
  const grid = document.getElementById('orders-grid');
  const cards = [...grid.querySelectorAll('.order-card')];
  const toggleWrapper = document.getElementById('orders-toggle-wrapper');
  const toggleBtn = document.getElementById('toggle-orders-btn');

  if (cards.length <= MAX_VISIBLE_ORDERS) {
    toggleWrapper.style.display = 'none';
    cards.forEach(card => card.style.display = 'block');
    return;
  }

  toggleWrapper.style.display = 'block';

  cards.forEach((card, index) => {
    if (showAllOrders || index < MAX_VISIBLE_ORDERS) {
      card.style.display = 'block';
    } else {
      card.style.display = 'none';
    }
  });

  toggleBtn.textContent = showAllOrders
    ? 'Show Less Orders'
    : `Show ${cards.length - MAX_VISIBLE_ORDERS} More Orders`;
}

  function removeOrderCard(orderId) {
    const card = activeOrders.get(orderId);
    if (!card) return;
    card.classList.add('removing');
    setTimeout(() => {
      card.remove();
      activeOrders.delete(orderId);
      updateActiveCount();
      refreshOrderVisibility();
      // Show empty state if nothing left
      if (activeOrders.size === 0) {
        const grid = document.getElementById('orders-grid');
        if (!document.getElementById('orders-empty')) {
          const empty = document.createElement('span');
          empty.className = 'orders-empty';
          empty.id = 'orders-empty';
          empty.textContent = 'No active orders — create one below.';
          grid.appendChild(empty);
        }
      }
    }, 420);
  }

  function updateActiveCount() {
    document.getElementById('stat-active').textContent = activeOrders.size;
    const label = document.getElementById('orders-count');
    if (label) label.textContent = activeOrders.size > 0 ? `(${activeOrders.size})` : '';
  }

  // ── Handle incoming change event ─────────────────────────────────
  function handleEvent(msg) {
    const { event, data, server_received_at } = msg;
    if (!event || !data) return;

    // Track latency
    if (server_received_at) {
      const latencyMs = (Date.now() / 1000 - server_received_at) * 1000;
      if (latencyMs >= 0 && latencyMs < 10000) {
        latencies.push(latencyMs);
        if (latencies.length > 50) latencies.shift();
        const avg = latencies.reduce((a, b) => a + b, 0) / latencies.length;
        document.getElementById('stat-latency').textContent = `${avg.toFixed(0)} ms`;
      }
    }

    // Update counters
    eventCount++;
    if (event === 'INSERT') insertCount++;
    else if (event === 'UPDATE') updateCount++;
    else if (event === 'DELETE') deleteCount++;

    document.getElementById('stat-total').textContent  = eventCount;
    document.getElementById('stat-insert').textContent = insertCount;
    document.getElementById('stat-update').textContent = updateCount;
    document.getElementById('stat-delete').textContent = deleteCount;

    // Update live order card
    if (event === 'INSERT') {
      renderOrderCard(data, 'flash-insert');
    } else if (event === 'UPDATE') {
      renderOrderCard(data, 'flash-update');
    } else if (event === 'DELETE') {
      removeOrderCard(data.id);
    }

    // Add event log row
    const empty = document.getElementById('empty-msg');
    if (empty) empty.remove();

    const row = document.createElement('div');
    row.className = `log-row new-${event.toLowerCase()}`;

    const now = new Date();
    const ts  = now.toTimeString().split(' ')[0];

    const statusText  = event === 'DELETE' ? 'deleted' : (data.status ?? '—');
    const statusClass = event === 'DELETE' ? 'status-deleted' : `status-${data.status}`;

    row.innerHTML = `
      <span class="ts">${ts}</span>
      <span><span class="badge badge-${event}">${event}</span></span>
      <span>${escHtml(data.customer_name ?? '—')}</span>
      <span>${escHtml(data.product_name  ?? '—')}</span>
      <span class="${statusClass}">${escHtml(statusText)}</span>
      <span class="ts">#${data.id}</span>
    `;

    const rows = document.getElementById('log-rows');
    rows.prepend(row);
    while (rows.children.length > 200) rows.removeChild(rows.lastChild);

    const toastType = event === 'DELETE' ? 'delete' : event === 'INSERT' ? 'insert' : '';
    toast(`${event} — Order #${data.id} · ${statusText}`, toastType);
  }

  // ── API calls ─────────────────────────────────────────────────────
  async function deleteOrder(orderId) {
    if (!orderId) return;
    try {
      const res = await fetch(`${API_BASE}/${orderId}`, { method: 'DELETE' });
      if (res.status === 404) { toast(`Order #${orderId} not found.`, 'delete'); return; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      // The WS event will handle the card removal; no need to do it here.
    } catch (err) {
      toast(`Delete failed: ${err.message}`, 'delete');
    }
  }

  // Create order
  document.getElementById('btn-create').addEventListener('click', async () => {
    const body = {
      customer_name: document.getElementById('inp-customer').value.trim() || 'Anonymous',
      product_name:  document.getElementById('inp-product').value.trim()  || 'Product',
      status:        document.getElementById('inp-status').value,
    };
    try {
      const res = await fetch(API_BASE + '/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(await res.text());
    } catch (err) {
      toast(`Create failed: ${err.message}`, 'delete');
    }
  });

  // Delete order via form
  document.getElementById('btn-delete').addEventListener('click', () => {
    const id = parseInt(document.getElementById('inp-delete-id').value, 10);
    if (!id || id < 1) { toast('Enter a valid order ID.', 'delete'); return; }
    deleteOrder(id);
  });

  // Update order status
  document.getElementById('btn-update').addEventListener('click', async () => {
    const id     = parseInt(document.getElementById('inp-update-id').value, 10);
    const status = document.getElementById('inp-update-status').value;
    if (!id || id < 1) { toast('Enter a valid order ID.', 'delete'); return; }
    try {
      const res = await fetch(`${API_BASE}/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      if (res.status === 404) { toast(`Order #${id} not found.`, 'delete'); return; }
      if (!res.ok) throw new Error(await res.text());
    } catch (err) {
      toast(`Update failed: ${err.message}`, 'delete');
    }
  });

  // Clear log
  document.getElementById('btn-clear').addEventListener('click', () => {
    const rows = document.getElementById('log-rows');
    rows.innerHTML = '<div class="empty-state" id="empty-msg">Waiting for events…</div>';
    eventCount = insertCount = updateCount = deleteCount = 0;
    latencies  = [];
    document.getElementById('stat-total').textContent   = '0';
    document.getElementById('stat-insert').textContent  = '0';
    document.getElementById('stat-update').textContent  = '0';
    document.getElementById('stat-delete').textContent  = '0';
    document.getElementById('stat-latency').textContent = '—';
  });

  document.getElementById('toggle-orders-btn').addEventListener('click', () => {
  showAllOrders = !showAllOrders;
  refreshOrderVisibility();
});

  // ── Helpers ───────────────────────────────────────────────────────
  function setStatus(state, text) {
    document.getElementById('status-dot').className    = state;
    document.getElementById('status-text').textContent = text;
  }

  function toast(message, type = '') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast${type ? ' toast-' + type : ''}`;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Boot ──────────────────────────────────────────────────────────
  loadInitialOrders();
  connect();
</script>
</body>
</html>
